site_name: "QC: Проектирование и оптимизация квантовых компьютеров"
site_description: "Учебный курс: от основ квантовых вычислений до оптимизации архитектуры и компиляции квантовых систем. Software/architecture трек + hardware трек."
site_author: "DrDimooon"

docs_dir: "."

# Рабочие заметки аудита не публикуются на сайте
exclude_docs: |
  AUDIT-NOTES.md

theme:
  name: material
  language: ru
  palette:
    primary: indigo
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      # generic: без «preview»-спанов: формула либо отрисована MathJax,
      # либо (если скрипт не загрузился) не показывается вовсе — но не как
      # сырой LaTeX в тексте.
      generic: true
  - tables
  - toc:
      permalink: true
      # Юникодная слагификация: иначе кириллица выбрасывается из якорей
      # заголовков и ссылки вида #как-проверять-решения не работают.
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
      separator: '-'
  - meta

extra_css:
  - assets/styles/interactive.css
  - assets/styles/admonitions.css

extra_javascript:
  # Библиотеки лежат в репозитории: сайт не зависит от доступности CDN
  # (внешний CDN мог не открыться — тогда формулы и схемы не рисовались вовсе).
  - assets/vendor/mermaid/mermaid.min.js
  - assets/js/mermaid-init.js
  # MathJax в режиме SVG: пути символов встроены в SVG, веб-шрифты не нужны.
  # В режиме CHTLМ MathJax тянет шрифты с CDN — при недоступном CDN
  # «растянутые» символы (корень, черта над дробью) ломались.
  - assets/vendor/mathjax/tex-mml-svg.js

