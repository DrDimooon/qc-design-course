      - PROGRESS: PROGRESS.md
      - Соглашение о кубитах: CONVENTIONS.md
      - Интерактивный слой: INTERACTIVE.md
  - Модуль 00 — Фундамент:
      - О модуле: curriculum/00-fundamentals/README.md
      - 01. Линейная алгебра: curriculum/00-fundamentals/01-linear-algebra.md
      - 02. Основы квантовой механики: curriculum/00-fundamentals/02-quantum-mechanics-basics.md
      - 03. Комплексные сигналы и кубиты: curriculum/00-fundamentals/03-complex-signals-qubits.md
      - Лаба 00. Настройка окружения: curriculum/00-fundamentals/lab-00-env-setup.md
