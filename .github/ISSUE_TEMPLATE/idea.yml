**Что предлагаете:** суть изменения в одном-двух предложениях

**Где применимо:** урок/раздел/весь модуль

**Зачем:** что это даст читателю (понятнее, быстрее, глубже, актуальнее)

**Альтернатива, которую рассматривали:** если есть

