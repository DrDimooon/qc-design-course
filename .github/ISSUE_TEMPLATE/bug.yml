---

**Где:** ссылка на файл и строку (например, `curriculum/02-programming/04-noise-simulation.md:120`)

**Что не так:** что написано сейчас

**Как правильно (по вашей проверке):** что должно быть + источник (ссылка на первоисточник, если это внешний факт)

**Почему важно:** ошибка в формуле / числе / команде / битая ссылка

