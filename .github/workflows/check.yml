name: Course checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs and Material for MkDocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material pymdown-extensions

      - name: Unit tests of the interactive core
        run: node tools/js/qc-core.test.js

      - name: Build the site (warnings are errors)
        run: python tools/build_site.py --strict

      - name: Check internal links and markdown blocks
        run: python tools/check_docs.py
